[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudwarden"
version = "0.1.0"
description = "Read-only security watchdog for small AWS and Azure accounts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.15",
  "azure-mgmt-network>=25.0",
  "azure-mgmt-storage>=21.0",
]
dev = ["pytest>=8", "moto[ec2,s3,iam]>=5"]

[project.scripts]
cloudwarden = "cloudwarden.cli:main"

[tool.setuptools.packages.find]
include = ["cloudwarden*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
